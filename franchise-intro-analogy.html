<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Franchise — Multi-Main Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f23;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Press Start 2P',monospace;font-size:10px;flex-direction:column;gap:16px}
.stage{position:relative;width:960px;height:540px;background:#1a1a2e;border:4px solid #333;overflow:hidden}
.stage::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px);pointer-events:none;z-index:50}
.title-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;z-index:20;text-shadow:2px 2px 0 #000}
.title-bar h1{font-size:11px;color:#a371f7}.title-bar p{font-size:7px;color:#aaa;margin-top:6px}
.sprite{position:absolute;transition:all .7s ease;opacity:0;z-index:5}.sprite.on{opacity:1}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .5s}.bg-img.on{opacity:1}
.pbubble{position:absolute;background:rgba(15,15,35,.92);border:3px solid #a371f7;padding:8px 14px;font-size:7px;color:#fff;opacity:0;transition:opacity .4s;max-width:260px;text-align:center;z-index:20;line-height:1.8;font-family:'Press Start 2P',monospace;backdrop-filter:blur(4px)}
.pbubble.show{opacity:1}.pbubble::after{content:'▼';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);color:#a371f7;font-size:10px}
.status{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:7px;color:#aaa;z-index:20;white-space:nowrap;opacity:0;transition:opacity .4s;text-shadow:2px 2px 0 #000;background:rgba(15,15,35,.7);padding:4px 12px;border-radius:4px}
.status.show{opacity:1}
.infra{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:rgba(15,15,35,.9);border:3px solid #a371f7;padding:8px 18px;z-index:10;opacity:0;transition:opacity .4s;backdrop-filter:blur(4px)}
.infra.on{opacity:1}.infra span{font-size:6px;color:#ddd}.infra .sep{color:#444}
.conn{position:absolute;width:3px;background:#a371f7;opacity:0;transition:opacity .4s;z-index:4}.conn.on{opacity:.5}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes cook{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slide{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}
.bounce{animation:bounceIn .5s ease forwards}.cook{animation:cook .6s ease infinite}
.pulse{animation:pulse 1.5s ease infinite}.slide{animation:slide .5s ease forwards}
.controls{display:flex;gap:10px}
button{font-family:'Press Start 2P',monospace;background:#a371f7;color:#fff;border:3px solid #8957e5;padding:8px 16px;font-size:9px;cursor:pointer}
button:hover{background:#b888ff}button.sec{background:#333;color:#999;border-color:#555}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="title-bar"><h1>FRANCHISE — MULTI-MAIN</h1><p>MULTIPLE LOCATIONS. ONE BRAND.</p></div>
  <div class="status" id="status"></div>
</div>
<div class="controls"><button onclick="play()">&#9654; PLAY (~45s)</button><button class="sec" onclick="reset()">&#8634; RESET</button></div>

<script>
const B='https://djangelic.github.io/openclaw/pixel-sprites/';
const IMG={franchise:B+'franchise-building.png',chef:B+'chef-cooking.png',cust:B+'customer.png',cust2:B+'customer-2.png',cust3:B+'customer-3.png',dev:B+'developer.png',testKit:B+'test-kitchen.png',wrench:B+'wrench-tool.png',bgStreet:B+'bg-street-night.png'};
Object.values(IMG).forEach(s=>{new Image().src=s});

const stage=document.getElementById('stage'),statusEl=document.getElementById('status');
let animating=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function addBg(src){const i=document.createElement('img');i.className='bg-img';i.src=src;stage.insertBefore(i,stage.firstChild);return i}
function addImg(src,x,y,w){const i=document.createElement('img');i.className='sprite';i.src=src;i.style.cssText=`left:${x}px;top:${y}px;width:${w}px`;stage.appendChild(i);return i}
function bubble(html,x,y){const d=document.createElement('div');d.className='pbubble';d.innerHTML=html;d.style.left=x+'px';d.style.top=y+'px';stage.appendChild(d);return d}
function show(e,cls=''){e.style.opacity='1';e.classList.add('on');if(cls)e.classList.add(cls)}
function hide(e){e.style.opacity='0';e.classList.remove('on')}
function setStatus(t){statusEl.textContent=t;statusEl.classList.add('show')}

function reset(){
  animating=false;
  stage.querySelectorAll('.sprite,.bg-img,.pbubble,.infra,.conn').forEach(e=>e.remove());
  statusEl.classList.remove('show');statusEl.textContent='';
}

async function play(){
  reset();await sleep(200);animating=true;
  const bg=addBg(IMG.bgStreet);show(bg);await sleep(300);

  const bx=[50,350,650],bldgs=[];
  for(let i=0;i<3;i++){
    const b=addImg(IMG.franchise,bx[i],140,210);show(b,'bounce');bldgs.push(b);
    const lbl=document.createElement('div');
    lbl.style.cssText=`position:absolute;left:${bx[i]+40}px;top:120px;font-size:8px;color:#a371f7;z-index:10;text-shadow:2px 2px 0 #000;font-family:'Press Start 2P',monospace`;
    lbl.textContent='LOCATION '+'ABC'[i];stage.appendChild(lbl);lbl.style.opacity='0';
    await sleep(200);lbl.style.opacity='1';lbl.style.transition='opacity .4s';
    await sleep(400);
  }
  setStatus('MULTIPLE LOCATIONS — SAME MENU, SAME EXPERIENCE');

  for(let i=0;i<3;i++){for(let j=0;j<2;j++){show(addImg(IMG.chef,bx[i]+50+j*50,380,60),'cook');await sleep(100)}}
  await sleep(1000);

  if(!animating)return;
  const custs=[IMG.cust,IMG.cust2,IMG.cust3];
  for(let i=0;i<3;i++){
    const c=addImg(custs[i],bx[i]+20,370,65);show(c,'slide');
    setStatus('CUSTOMER WALKS INTO LOCATION '+'ABC'[i]+'...');await sleep(1500);
  }
  await sleep(1000);

  if(!animating)return;
  const wrench=addImg(IMG.wrench,400,250,70);show(wrench,'pulse');
  bldgs[1].style.opacity='.3';
  const sp1=bubble("LOCATION B DOWN<br>FOR MAINTENANCE...",310,70);
  await sleep(300);sp1.classList.add('show');
  setStatus('LOCATION B IS DOWN — BUT OTHERS KEEP RUNNING!');
  await sleep(3500);sp1.classList.remove('show');

  if(!animating)return;
  const sp2=bubble("CUSTOMERS JUST WALK<br>TO ANOTHER LOCATION",40,70);
  await sleep(300);sp2.classList.add('show');
  setStatus('TRUE HIGH AVAILABILITY — ONE DOWN, OTHERS SERVE');
  await sleep(3500);sp2.classList.remove('show');
  hide(wrench);bldgs[1].style.opacity='1';

  if(!animating)return;
  for(let i=0;i<3;i++){show(addImg(IMG.testKit,bx[i]+70,310,80),'bounce');await sleep(300)}
  setStatus('EVERY LOCATION HAS ITS OWN TEST KITCHEN');await sleep(2500);

  if(!animating)return;
  const dev=addImg(IMG.dev,bx[0]+70,340,70);show(dev,'bounce');
  const sp3=bubble("DEVS CAN BUILD<br>FROM ANY LOCATION!",30,70);
  await sleep(300);sp3.classList.add('show');
  setStatus('MULTIPLE UI INSTANCES — BUILD FROM ANYWHERE');await sleep(3500);sp3.classList.remove('show');

  if(!animating)return;
  const closed=document.createElement('div');
  closed.style.cssText=`position:absolute;left:${bx[0]+80}px;top:340px;font-size:6px;color:#f85149;z-index:10;font-family:'Press Start 2P',monospace;text-shadow:1px 1px 0 #000`;
  closed.textContent='[CLOSED]';stage.appendChild(closed);
  const sp4=bubble("KITCHEN A CLOSED?<br>WALK TO B!",180,70);
  await sleep(300);sp4.classList.add('show');
  dev.style.left=(bx[1]+70)+'px';
  setStatus('TEST KITCHEN CLOSED? WALK TO ANOTHER. KEEP CREATING.');
  await sleep(3500);sp4.classList.remove('show');

  if(!animating)return;
  const infra=document.createElement('div');infra.className='infra';
  infra.innerHTML='<span>REDIS QUEUE</span><span class="sep">|</span><span>SHARED DB</span><span class="sep">|</span><span>SYNCED STATE</span>';
  stage.appendChild(infra);await sleep(200);infra.classList.add('on');

  for(let i=0;i<3;i++){
    const c=document.createElement('div');c.className='conn';
    c.style.cssText=`left:${bx[i]+105}px;top:400px;height:55px`;
    stage.appendChild(c);await sleep(200);c.classList.add('on');
  }
  setStatus('ALL LOCATIONS SHARE REDIS + DATABASE — TRUE SYNC');await sleep(3000);

  if(!animating)return;
  closed.remove();
  const sp5=bubble("<span style='color:#a371f7'>MULTI-MAIN MODE</span><br><span style='color:#888'>ENTERPRISE LICENSE</span><br><br>MULTIPLE UI INSTANCES<br>MULTIPLE BUILD ENVS<br>ONE SHARED BRAIN<br><span style='color:#3fb950'>TRUE HIGH AVAILABILITY</span>",310,40);
  await sleep(300);sp5.classList.add('show');
  setStatus('MULTI-MAIN: MULTIPLE LOCATIONS, SAME RECIPES, TRUE HA');
  await sleep(6000);animating=false;
}
</script>
</body>
</html>
