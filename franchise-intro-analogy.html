<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Franchise Mode — The Split Queue Problem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;flex-direction:column;gap:20px}
.stage{position:relative;width:960px;height:540px;background:#161b22;border:1px solid #30363d;border-radius:20px;overflow:hidden}
.ground{position:absolute;bottom:0;width:100%;height:80px;background:linear-gradient(0deg,#1a1e24,#21262d)}

.title-bar{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
.title-bar h1{font-size:1.5em;color:#f85149;font-weight:800}
.title-bar p{font-size:.85em;color:#8b949e;margin-top:2px}

.actor{position:absolute;font-size:3em;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));transition:all .8s ease;opacity:0}
.actor.on{opacity:1}

.speech{position:absolute;background:#21262d;border:1px solid #30363d;border-radius:12px;padding:10px 16px;font-size:.9em;color:#e6edf3;opacity:0;transition:opacity .5s;max-width:260px;text-align:center;z-index:20}
.speech::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #21262d}
.speech.show{opacity:1}

.label{position:absolute;font-size:.75em;color:#8b949e;text-align:center;opacity:0;transition:opacity .5s}
.label.on{opacity:1}

.status{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:.9em;color:#8b949e;z-index:10;white-space:nowrap;opacity:0;transition:opacity .5s}
.status.show{opacity:1}

/* Road / street between buildings */
.road{position:absolute;background:repeating-linear-gradient(90deg,#30363d 0,#30363d 20px,transparent 20px,transparent 40px);height:6px;opacity:0;transition:opacity .5s}
.road.on{opacity:.7}

/* Animations */
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes run-right{0%{transform:translateX(0)}100%{transform:translateX(280px)}}
@keyframes run-left{0%{transform:translateX(0)}100%{transform:translateX(-280px)}}
@keyframes sweat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes cook{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-4deg) translateY(-2px)}75%{transform:rotate(4deg) translateY(-2px)}}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(248,81,73,0)}50%{box-shadow:0 0 20px 8px rgba(248,81,73,.3)}}
@keyframes flicker{0%,100%{opacity:.7}50%{opacity:.15}}

.popping{animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
.floating{animation:float 2s ease-in-out infinite}
.shaking{animation:shake .4s ease infinite}
.sweating{animation:sweat 1.5s ease infinite}
.cooking{animation:cook .6s ease infinite}

/* Network cable */
.cable{position:absolute;height:4px;border-radius:2px;opacity:0;transition:opacity .5s}
.cable.on{opacity:.8}
.cable.healthy{background:repeating-linear-gradient(90deg,#3fb950 0,#3fb950 10px,transparent 10px,transparent 20px)}
.cable.stressed{background:repeating-linear-gradient(90deg,#ff6b35 0,#ff6b35 10px,transparent 10px,transparent 20px)}
.cable.broken{background:repeating-linear-gradient(90deg,#f85149 0,#f85149 10px,transparent 10px,transparent 20px);animation:flicker 1s infinite}

/* Packet dots traveling the cable */
.packet{position:absolute;width:10px;height:10px;border-radius:50%;opacity:0;z-index:5}
.packet.go-right{animation:travel-right 1.5s linear forwards}
.packet.go-left{animation:travel-left 1.5s linear forwards}
@keyframes travel-right{0%{opacity:1;left:310px}100%{opacity:0;left:590px}}
@keyframes travel-left{0%{opacity:1;left:590px}100%{opacity:0;left:310px}}

.controls{display:flex;gap:10px}
button{background:#ff6b35;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:1em;cursor:pointer;font-weight:600}
button:hover{background:#e55a25}
button.sec{background:#21262d;color:#8b949e}
button.sec:hover{background:#30363d}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="title-bar">
    <h1>🏢 The Franchise — Split Queue Mode</h1>
    <p>"What if we put the kitchen... across the street?"</p>
  </div>
  <div class="ground"></div>
  <div class="status" id="status"></div>
</div>

<div class="controls">
  <button onclick="play()">▶ Play</button>
  <button class="sec" onclick="reset()">↺ Reset</button>
</div>

<script>
const stage=document.getElementById('stage'),statusEl=document.getElementById('status');
let animating=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function mk(tag,cls,props={}){const d=document.createElement('div');d.className=cls;Object.assign(d.style,props);return d}
function actor(emoji,x,y,size='3em',id=''){const d=mk('div','actor',{left:x+'px',top:y+'px',fontSize:size});d.textContent=emoji;if(id)d.id=id;stage.appendChild(d);return d}
function label(text,x,y){const d=mk('div','label',{left:x+'px',top:y+'px'});d.textContent=text;stage.appendChild(d);return d}
function bubble(html,x,y){const d=mk('div','speech',{left:x+'px',top:y+'px'});d.innerHTML=html;stage.appendChild(d);return d}
function show(e,cls=''){e.classList.add('on');if(cls)e.classList.add(cls)}
function hide(e){e.classList.remove('on','show')}
function setStatus(t){statusEl.textContent=t;statusEl.classList.add('show')}
function sendPacket(color,dir){const d=mk('div','packet '+dir,{top:'308px',background:color});stage.appendChild(d);setTimeout(()=>d.remove(),1600)}

function reset(){
  animating=false;
  stage.querySelectorAll('.actor,.speech,.label,.road,.cable,.packet').forEach(e=>e.remove());
  statusEl.classList.remove('show');statusEl.textContent='';
}

async function play(){
  reset();await sleep(200);animating=true;

  // ═══════ ACT 1: The Idea — "Let's expand!" ═══════
  
  // Start with the successful restaurant
  const restaurant=actor('🍽️',100,220,'5em');show(restaurant,'popping');
  await sleep(600);
  const chefs=[];
  for(let i=0;i<3;i++){chefs.push(actor('👨‍🍳',180+i*45,300,'2em'));show(chefs[i],'popping');await sleep(200)}
  
  const lbl1=label('The Restaurant (Queue Mode)',80,195);lbl1.classList.add('on');
  setStatus('🍽️ Restaurant doing great — 266 RPS, zero failures');
  await sleep(3000);
  
  const sp1=bubble("Business is booming!<br>Let's open a<br>second location! 🤩",60,100);
  await sleep(300);sp1.classList.add('show');
  await sleep(4000);
  sp1.classList.remove('show');

  // ═══════ ACT 2: The Split — Building across the street ═══════
  if(!animating)return;
  
  // New building appears on the right
  const factory=actor('🏭',680,220,'5em');show(factory,'popping');
  await sleep(600);
  
  const lbl2=label('The Kitchen (Workers)',680,195);lbl2.classList.add('on');
  
  // Chefs walk over to the new building
  setStatus('💡 "Move the kitchen to its own building — more space!"');
  await sleep(2000);
  
  const sp2=bubble("We'll put the chefs<br>in a bigger kitchen<br>across the street!",600,100);
  await sleep(300);sp2.classList.add('show');
  await sleep(3000);
  sp2.classList.remove('show');
  
  if(!animating)return;
  // Move chefs to the factory
  for(const c of chefs){c.style.left='720px';c.style.top='300px';await sleep(400)}
  await sleep(1000);
  
  // Restaurant becomes just front-of-house
  const host=actor('💁',200,300,'2.5em');show(host,'popping');
  const lbl3=label('Front of House Only\n(Main Instance)',85,340);lbl3.classList.add('on');
  const lbl4=label('Kitchen Staff\n(Worker Instance)',695,340);lbl4.classList.add('on');
  
  setStatus('Split: Main takes orders → sends to workers across the network');
  await sleep(3000);

  // ═══════ ACT 3: The Street — Network connection ═══════
  if(!animating)return;
  
  // Draw the road between them
  const road=mk('div','road on',{left:'300px',top:'330px',width:'300px'});stage.appendChild(road);
  
  // Network cable
  const cable=mk('div','cable healthy on',{left:'300px',top:'310px',width:'300px'});stage.appendChild(cable);
  const cableLbl=label('🔌 Network Connection',380,290);cableLbl.classList.add('on');
  
  await sleep(2000);
  
  const sp3=bubble("Easy! Orders go over<br>the network to<br>the kitchen!",380,80);
  await sleep(300);sp3.classList.add('show');
  setStatus('Sounds great in theory...');
  await sleep(4000);
  sp3.classList.remove('show');

  // ═══════ ACT 4: Reality — Every order crosses the street ═══════
  if(!animating)return;
  
  setStatus('🎫 First orders come in...');
  await sleep(1500);
  
  // Customer orders — packet travels across
  const customers=['🧑','👩','🧔','👦','👩‍🦰','🧑‍🦱'];
  
  // A few orders — seems fine at first
  for(let i=0;i<2;i++){
    if(!animating)return;
    const c=actor(customers[i],30,280+i*25,'2em');show(c,'popping');
    await sleep(400);
    
    // Order ticket travels to kitchen
    sendPacket('#3fb950','go-right');
    setStatus('📤 Order sent across the network...');
    await sleep(1500);
    
    // Food comes back
    sendPacket('#58a6ff','go-left');
    setStatus('📥 Food comes back...');
    await sleep(1500);
    
    const plate=actor(['🍝','🍔'][i],50+i*30,260,'1.5em');show(plate,'popping');
  }
  
  setStatus('Seems okay so far... but watch what happens under load');
  await sleep(3000);
  
  // ═══════ ACT 5: The Rush — Network becomes bottleneck ═══════
  if(!animating)return;
  
  // Crowd arrives
  const sp4=bubble("Friday night<br>rush! 🔥",30,180);
  await sleep(300);sp4.classList.add('show');
  
  for(let i=2;i<6;i++){
    const c=actor(customers[i],20+i*20,270+((i%2)*25),'1.8em');show(c,'popping');
    await sleep(200);
  }
  await sleep(1500);
  sp4.classList.remove('show');
  
  // Packets flying back and forth — cable turns orange
  cable.classList.remove('healthy');cable.classList.add('stressed');
  setStatus('⚠️ Every single order has to cross the street and come back...');
  
  for(let i=0;i<6;i++){
    if(!animating)return;
    sendPacket('#ff6b35','go-right');
    await sleep(300);
    sendPacket('#ff6b35','go-right');
    await sleep(300);
    sendPacket('#58a6ff','go-left');
    await sleep(400);
  }
  
  await sleep(1000);
  
  // ═══════ ACT 6: The Problem Revealed ═══════
  if(!animating)return;
  
  // Cable turns red / broken
  cable.classList.remove('stressed');cable.classList.add('broken');
  
  // Host is overwhelmed
  host.classList.add('shaking');
  
  // Runner between buildings is exhausted
  const runner=actor('🏃',420,290,'2.5em');show(runner,'sweating');
  
  const sp5=bubble("Every. Single. Order.<br>Crosses. The. Street.<br>And comes back! 😰",350,70);
  await sleep(300);sp5.classList.add('show');
  setStatus('🔴 Network latency on EVERY request — the street becomes the bottleneck');
  await sleep(5000);
  sp5.classList.remove('show');
  
  // ═══════ ACT 7: The Verdict ═══════
  if(!animating)return;
  
  // Comparison appears
  const sp6=bubble("<span style='color:#58a6ff;font-weight:700'>Restaurant (all-in-one):<br>266 RPS ✅</span><br><br><span style='color:#f85149;font-weight:700'>Franchise (split):<br>128 RPS ❌</span><br><br><span style='color:#8b949e'>More machines.<br>More money.<br>LESS performance.</span>",340,60);
  await sleep(300);sp6.classList.add('show');
  
  // Big red X over the cable
  const bigX=actor('❌',420,300,'3em');show(bigX,'popping');
  
  setStatus('🏢 Split Queue: 128 RPS — more money, more hardware, 52% LESS throughput than all-in-one');
  await sleep(6000);
  sp6.classList.remove('show');
  
  if(!animating)return;
  const sp7=bubble("Don't put your kitchen<br>across the street.<br><span style='color:#3fb950;font-weight:700'>Keep it in the building.</span> 🍽️",340,100);
  await sleep(300);sp7.classList.add('show');
  setStatus('💡 The lesson: split queue adds latency. Scale UP (bigger instance), not OUT (more machines)');
  
  await sleep(6000);
  animating=false;
}
</script>
</body>
</html>
