<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n Enterprise Benchmarking V2 - B-Roll Visualizations</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ff6b35;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .scene-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, button {
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #21262d;
            border-color: #f0f6fc1a;
        }

        .auto-play-btn {
            background: #ff6b35;
            color: white;
            font-weight: bold;
        }

        .auto-play-btn:hover {
            background: #e5522b;
        }

        .counter {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            min-width: 150px;
        }

        .counter .vu-count {
            font-size: 24px;
            font-weight: bold;
            color: #58a6ff;
        }

        .counter .rps-count {
            font-size: 18px;
            color: #ff6b35;
        }

        .chart-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            position: relative;
        }

        .scene-title {
            color: #ff6b35;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .scene-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .chart-wrapper {
            position: relative;
            height: 500px;
            margin: 20px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
        }

        .stat-card.visible {
            opacity: 1;
            transform: scale(1);
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #8b949e;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            color: #8b949e;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>n8n Enterprise Benchmarking V2</h1>
            <p>Interactive B-Roll Data Visualizations</p>
        </div>

        <div class="controls">
            <div class="scene-selector">
                <label for="sceneSelect">Scene:</label>
                <select id="sceneSelect">
                    <option value="1">1. SQLite Flat Line</option>
                    <option value="2">2. PostgreSQL Default Scaling</option>
                    <option value="3">3. SQLite vs PG Comparison</option>
                    <option value="4">4. PGTune Improvement (+34%)</option>
                    <option value="5">5. The Big Jump (Queue Mode)</option>
                    <option value="6">6. Queue Mode Line Chart</option>
                    <option value="7">7. Queue Tuning Barely Matters</option>
                    <option value="8">8. Split Queue Surprise</option>
                    <option value="9">9. The Full Scaling Ladder</option>
                    <option value="10">10. Binary Data Reality</option>
                    <option value="11">11. Hero Stats Reveal</option>
                </select>
                <button onclick="playScene()">Play</button>
                <button onclick="resetScene()">Reset</button>
            </div>
            
            <button class="auto-play-btn" onclick="autoPlayAll()">Auto-Play All Scenes</button>
            
            <div class="counter">
                <div class="vu-count" id="vuCount">0 VUs</div>
                <div class="rps-count" id="rpsCount">0 RPS</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="scene-title" id="sceneTitle">Select a scene to begin</div>
            <div class="chart-wrapper">
                <canvas id="mainChart"></canvas>
            </div>
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>

    <script>
        let chart = null;
        let currentScene = 1;
        let animationTimeout = null;
        let autoPlayRunning = false;

        const colors = {
            sqlite: '#484f58',      // gray
            pgDefault: '#ff6b35',   // orange-light  
            pgTuned: '#ff6b35',     // orange
            splitQueue: '#f85149',  // red
            queueDefault: '#58a6ff', // blue
            queueTuned: '#3fb950',  // green
            background: '#0d1117',
            chartBg: '#161b22',
            border: '#30363d',
            text: '#c9d1d9'
        };

        const sceneData = {
            1: {
                title: "Scene 1: SQLite Flat Line",
                type: 'line',
                data: {
                    labels: ['3 VUs', '10 VUs', '50 VUs', '200 VUs'],
                    datasets: [{
                        label: 'SQLite RPS',
                        data: [47, 47, 48, 48],
                        borderColor: colors.sqlite,
                        backgroundColor: colors.sqlite + '20',
                        borderWidth: 3,
                        fill: false
                    }]
                },
                description: "SQLite hits its ceiling at ~48 RPS regardless of load"
            },
            2: {
                title: "Scene 2: PostgreSQL Default Scaling",
                type: 'line',
                data: {
                    labels: ['3 VUs', '10 VUs', '50 VUs', '100 VUs', '200 VUs'],
                    datasets: [{
                        label: 'PostgreSQL Default',
                        data: [8, 18, 43, 59, 71],
                        borderColor: colors.pgDefault,
                        backgroundColor: colors.pgDefault + '20',
                        borderWidth: 3,
                        fill: false
                    }]
                },
                description: "PostgreSQL scales with load, climbing past SQLite"
            },
            3: {
                title: "Scene 3: SQLite vs PG Default Comparison",
                type: 'line',
                data: {
                    labels: ['3 VUs', '10 VUs', '50 VUs', '100 VUs', '200 VUs'],
                    datasets: [
                        {
                            label: 'SQLite',
                            data: [47, 47, 48, 48, 48],
                            borderColor: colors.sqlite,
                            backgroundColor: colors.sqlite + '20',
                            borderWidth: 3,
                            fill: false
                        },
                        {
                            label: 'PostgreSQL Default',
                            data: [8, 18, 43, 59, 71],
                            borderColor: colors.pgDefault,
                            backgroundColor: colors.pgDefault + '20',
                            borderWidth: 3,
                            fill: false
                        }
                    ]
                },
                description: "Two different scaling patterns: flat vs climbing"
            },
            4: {
                title: "Scene 4: PGTune Improvement (Food Truck)",
                type: 'bar',
                data: {
                    labels: ['PG Default', 'PG Tuned'],
                    datasets: [{
                        label: 'RPS',
                        data: [71, 95],
                        backgroundColor: [colors.pgDefault + '80', colors.pgTuned],
                        borderColor: [colors.pgDefault, colors.pgTuned],
                        borderWidth: 2
                    }]
                },
                description: "+34% FREE performance boost with PGTune"
            },
            5: {
                title: "Scene 5: The Big Jump — Queue Mode",
                type: 'bar',
                data: {
                    labels: ['PG Tuned', 'Queue Default'],
                    datasets: [{
                        label: 'RPS',
                        data: [95, 266],
                        backgroundColor: [colors.pgTuned + '80', colors.queueDefault],
                        borderColor: [colors.pgTuned, colors.queueDefault],
                        borderWidth: 2
                    }]
                },
                description: "~3x performance jump to Queue Mode - DRAMATIC!"
            },
            6: {
                title: "Scene 6: Queue Mode Line Chart",
                type: 'line',
                data: {
                    labels: ['3 VUs', '10 VUs', '30 VUs', '100 VUs', '200 VUs'],
                    datasets: [{
                        label: 'Queue Default',
                        data: [221, 266, 266, 255, 260],
                        borderColor: colors.queueDefault,
                        backgroundColor: colors.queueDefault + '20',
                        borderWidth: 3,
                        fill: false
                    }]
                },
                description: "Queue mode maintains high performance across load levels"
            },
            7: {
                title: "Scene 7: Queue Tuning Barely Matters",
                type: 'bar',
                data: {
                    labels: ['Queue Default', 'Queue Tuned'],
                    datasets: [{
                        label: 'RPS',
                        data: [266, 280],
                        backgroundColor: [colors.queueDefault + '80', colors.queueTuned],
                        borderColor: [colors.queueDefault, colors.queueTuned],
                        borderWidth: 2
                    }]
                },
                description: "Only +5% gain vs PGTune's +34%"
            },
            8: {
                title: "Scene 8: Split Queue Surprise",
                type: 'bar',
                data: {
                    labels: ['All-in-one Queue', 'Split Queue'],
                    datasets: [{
                        label: 'RPS',
                        data: [266, 128],
                        backgroundColor: [colors.queueDefault, colors.splitQueue + '80'],
                        borderColor: [colors.queueDefault, colors.splitQueue],
                        borderWidth: 2
                    }]
                },
                description: "More $$, Less Performance - Split Queue FAILS"
            },
            9: {
                title: "Scene 9: The Full Scaling Ladder",
                type: 'bar',
                data: {
                    labels: ['SQLite', 'PG Default', 'PG Tuned', 'Split Queue', 'Queue Default', 'Queue Tuned'],
                    datasets: [{
                        label: 'Peak RPS',
                        data: [48, 71, 95, 128, 266, 280],
                        backgroundColor: [
                            colors.sqlite,
                            colors.pgDefault + '80',
                            colors.pgTuned,
                            colors.splitQueue + '40',
                            colors.queueDefault,
                            colors.queueTuned
                        ],
                        borderColor: [
                            colors.sqlite,
                            colors.pgDefault,
                            colors.pgTuned,
                            colors.splitQueue,
                            colors.queueDefault,
                            colors.queueTuned
                        ],
                        borderWidth: 2
                    }]
                },
                indexAxis: 'y',
                description: "Complete performance ranking - recommended path: 48→71→95→266→280"
            },
            10: {
                title: "Scene 10: Binary Data Reality",
                type: 'bar',
                data: {
                    labels: ['SQLite', 'PG Default', 'PG Tuned', 'Queue/Split'],
                    datasets: [{
                        label: 'RPS',
                        data: [9, 9, 9, 0],
                        backgroundColor: [
                            colors.sqlite + '80',
                            colors.pgDefault + '80',
                            colors.pgTuned + '80',
                            colors.splitQueue
                        ],
                        borderColor: [
                            colors.sqlite,
                            colors.pgDefault,
                            colors.pgTuned,
                            colors.splitQueue
                        ],
                        borderWidth: 2
                    }]
                },
                description: "Binary data breaks most configurations - Queue/Split show 500 ERROR"
            },
            11: {
                title: "Scene 11: Hero Stats Reveal",
                type: 'stats',
                stats: [
                    { value: "48 → 280 RPS", label: "5.8x Scaling Through Architecture", color: colors.queueTuned },
                    { value: "34%", label: "Free PGTune Gain", color: colors.pgTuned },
                    { value: "266 RPS", label: "Queue Mode Default (No Tuning Needed)", color: colors.queueDefault },
                    { value: "0%", label: "Failure Rate", color: colors.queueTuned },
                    { value: "128 < 266", label: "Split Queue Warning", color: colors.splitQueue }
                ],
                description: "Key takeaways from the complete benchmark"
            }
        };

        function updateCounter(vu, rps) {
            document.getElementById('vuCount').textContent = vu ? `${vu} VUs` : '0 VUs';
            document.getElementById('rpsCount').textContent = rps ? `${rps} RPS` : '0 RPS';
        }

        function createChart(sceneNum) {
            const scene = sceneData[sceneNum];
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            document.getElementById('sceneTitle').textContent = scene.title;
            document.getElementById('statsGrid').innerHTML = '';

            if (scene.type === 'stats') {
                document.getElementById('mainChart').style.display = 'none';
                showStatsCards(scene.stats);
                return;
            }

            document.getElementById('mainChart').style.display = 'block';

            const options = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        labels: { color: colors.text }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: colors.text },
                        grid: { color: colors.border }
                    },
                    y: {
                        ticks: { color: colors.text },
                        grid: { color: colors.border }
                    }
                },
                animation: { duration: 0 }
            };

            if (scene.indexAxis) {
                options.indexAxis = scene.indexAxis;
            }

            chart = new Chart(ctx, {
                type: scene.type,
                data: JSON.parse(JSON.stringify(scene.data)),
                options: options
            });

            // Clear data for animation
            scene.data.datasets.forEach(dataset => {
                dataset.data = dataset.data.map(() => 0);
            });
            chart.update('none');
        }

        function showStatsCards(stats) {
            const grid = document.getElementById('statsGrid');
            stats.forEach((stat, index) => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="stat-value" style="color: ${stat.color}">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                `;
                grid.appendChild(card);
                
                setTimeout(() => {
                    card.classList.add('visible');
                }, index * 400);
            });
        }

        function animateChart(sceneNum) {
            const scene = sceneData[sceneNum];
            
            if (scene.type === 'stats') {
                return;
            }

            const originalData = JSON.parse(JSON.stringify(scene.data));
            let dataIndex = 0;
            
            function animateNextPoint() {
                if (dataIndex < originalData.labels.length) {
                    originalData.datasets.forEach((dataset, dsIndex) => {
                        chart.data.datasets[dsIndex].data[dataIndex] = dataset.data[dataIndex];
                    });
                    
                    const currentLabel = originalData.labels[dataIndex];
                    const rpsValues = originalData.datasets.map(ds => ds.data[dataIndex]);
                    const maxRps = Math.max(...rpsValues);
                    
                    // Extract VU count from label
                    const vuMatch = currentLabel.match(/(\d+)/);
                    const vuCount = vuMatch ? vuMatch[1] : '0';
                    
                    updateCounter(vuCount, maxRps);
                    
                    chart.update('active');
                    dataIndex++;
                    animationTimeout = setTimeout(animateNextPoint, 800);
                }
            }
            
            animateNextPoint();
        }

        function playScene() {
            if (animationTimeout) {
                clearTimeout(animationTimeout);
            }
            
            const sceneNum = parseInt(document.getElementById('sceneSelect').value);
            createChart(sceneNum);
            setTimeout(() => animateChart(sceneNum), 100);
        }

        function resetScene() {
            if (animationTimeout) {
                clearTimeout(animationTimeout);
            }
            
            const sceneNum = parseInt(document.getElementById('sceneSelect').value);
            createChart(sceneNum);
            updateCounter(0, 0);
        }

        function autoPlayAll() {
            if (autoPlayRunning) return;
            
            autoPlayRunning = true;
            const button = document.querySelector('.auto-play-btn');
            const originalText = button.textContent;
            button.textContent = 'Playing All Scenes...';
            button.disabled = true;
            
            let sceneNum = 1;
            
            function playNextScene() {
                if (sceneNum <= 11) {
                    document.getElementById('sceneSelect').value = sceneNum;
                    createChart(sceneNum);
                    
                    setTimeout(() => {
                        animateChart(sceneNum);
                        sceneNum++;
                        setTimeout(playNextScene, sceneData[sceneNum-1]?.type === 'stats' ? 4000 : 6000);
                    }, 100);
                } else {
                    autoPlayRunning = false;
                    button.textContent = originalText;
                    button.disabled = false;
                }
            }
            
            playNextScene();
        }

        // Initialize
        document.getElementById('sceneSelect').addEventListener('change', function() {
            currentScene = parseInt(this.value);
            resetScene();
        });

        // Load first scene
        createChart(1);
    </script>
</body>
</html>
