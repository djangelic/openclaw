<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--text-dim:#8b949e;--accent:#58a6ff;--accent2:#f78166;--green:#3fb950;--card-hover:#1c2128}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;line-height:1.6;padding:0 16px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:1012px;margin:0 auto;padding:24px 0}
header{text-align:center;padding:48px 0 32px;border-bottom:1px solid var(--border);margin-bottom:32px}
header h1{font-size:2rem;font-weight:600}
header h1 span{color:var(--accent2)}
header p{color:var(--text-dim);margin-top:8px;font-size:1.05rem}
.stats{color:var(--text-dim);margin-top:12px;font-size:.85rem}
.stats strong{color:var(--green)}
.search-box{margin:24px auto 0;max-width:480px}
.search-box input{width:100%;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.95rem;outline:none}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.15)}
.section{margin-bottom:16px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.section-header{background:var(--surface);padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.section-header:hover{background:var(--card-hover)}
.section-header .icon{font-size:1.2rem}
.section-header h2{font-size:.95rem;font-weight:600;flex:1}
.section-header .desc{color:var(--text-dim);font-size:.8rem;font-weight:400;margin-left:8px}
.section-header .count{color:var(--text-dim);font-size:.75rem;background:var(--border);padding:2px 8px;border-radius:10px}
.section-body{display:none}
.section.open .section-body{display:block}
.section-header .arrow{color:var(--text-dim);transition:transform .2s;font-size:.7rem}
.section.open .section-header .arrow{transform:rotate(90deg)}
.file-list{list-style:none}
.file-list li{padding:8px 16px 8px 42px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:.9rem}
.file-list li:hover{background:var(--card-hover)}
.file-list li .ficon{color:var(--text-dim);font-size:.8rem;width:16px;text-align:center}
.file-list li a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-list li .badge{font-size:.7rem;color:var(--text-dim);background:var(--border);padding:1px 6px;border-radius:4px;flex-shrink:0}
.file-list li .sub{color:var(--text-dim);font-size:.75rem;margin-right:4px}
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.thumb-grid img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:4px;background:var(--card-hover);image-rendering:pixelated}
.thumb-grid a{display:block}
.thumb-grid .sub-label{grid-column:1/-1;color:var(--text-dim);font-size:.75rem;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
footer{text-align:center;padding:32px 0;color:var(--text-dim);font-size:.8rem;border-top:1px solid var(--border);margin-top:16px}
@media(max-width:600px){header h1{font-size:1.5rem}.section-header .desc{display:none}.thumb-grid{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}}
</style>

function fileLink(folder, file) {
  const path = folder === '_root' ? file : `${folder}/${file}`;
  const ext = file.split('.').pop().toLowerCase();
  if (['html','png','jpg','jpeg','gif','svg','json'].includes(ext)) {
    return `${PAGES_BASE}${path}`;
  }
  return `${GITHUB_BASE}${path}`;
}

function fileIcon(file) {
  const ext = file.split('.').pop().toLowerCase();
  const map = {html:'\u{1F310}',md:'\u{1F4C4}',py:'\u{1F40D}',png:'\u{1F5BC}',jpg:'\u{1F5BC}',jpeg:'\u{1F5BC}',
    json:'\u{1F4CB}',js:'\u{1F7E8}',ts:'\u{1F535}',vue:'\u{1F49A}',svg:'\u{1F3A8}',yml:'\u{2699}',
    sh:'\u{1F4E6}',txt:'\u{1F4C3}',gif:'\u{1F3AC}'};
  return map[ext] || '\u{1F4C4}';
}

function render() {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  let totalFiles = 0;
  let totalSections = 0;

  sections.forEach(s => {
    const div = document.createElement('div');
    div.className = 'section';
    div.dataset.id = s.id;

    // Count files
    let count = 0;
    if (s.files) count += s.files.length;
    if (s.thumbs) count += s.thumbs.length;
    if (s.thumbGroups) s.thumbGroups.forEach(g => count += g.files.length);
    if (s.rootFiles) count += s.rootFiles.length;
    if (s.pokemonNote) count += 302; // 151 static + 151 animated pokemon sprites
    totalFiles += count;
    totalSections++;

    div.innerHTML = `<div class="section-header" onclick="this.parentElement.classList.toggle('open')">
      <span class="arrow">&#x25B6;</span><span class="icon">${s.icon}</span>
      <h2>${s.name}<span class="desc">${s.desc}</span></h2>
      <span class="count">${count} files</span>
    </div><div class="section-body"></div>`;
    const body = div.querySelector('.section-body');

    // File list
    const allFiles = s.files || (s.rootFiles ? s.rootFiles.map(f=>f.path) : null);
    if (allFiles) {
      const ul = document.createElement('ul');
      ul.className = 'file-list';
      allFiles.forEach(f => {
        const li = document.createElement('li');
        const name = f.includes('/') ? f : f;
        const ext = f.split('.').pop().toLowerCase();
        const sub = f.includes('/') ? f.substring(0, f.lastIndexOf('/')) + '/' : '';
        const link = fileLink(s.id, f);
        li.innerHTML = `<span class="ficon">${fileIcon(f)}</span>${sub?`<span class="sub">${sub}</span>`:''}<a href="${link}" target="_blank">${f.includes('/')?f.split('/').pop():f}</a><span class="badge">${ext}</span>`;
        li.dataset.name = f.toLowerCase();
        ul.appendChild(li);
      });
      body.appendChild(ul);
    }

    // Thumbnails
    if (s.thumbs) {
      const grid = document.createElement('div');
      grid.className = 'thumb-grid';
      s.thumbs.forEach(t => {
        grid.innerHTML += `<a href="${s.id}/${t}" target="_blank" title="${t}"><img src="${s.id}/${t}" alt="${t}" loading="lazy"></a>`;
      });
      body.appendChild(grid);
    }

    // Thumb groups
    if (s.thumbGroups) {
      const grid = document.createElement('div');
      grid.className = 'thumb-grid';
      s.thumbGroups.forEach(g => {
        grid.innerHTML += `<div class="sub-label">${g.label}</div>`;
        g.files.forEach(t => {
          grid.innerHTML += `<a href="${s.id}/${t}" target="_blank" title="${t.split('/').pop()}"><img src="${s.id}/${t}" alt="${t.split('/').pop()}" loading="lazy"></a>`;
        });
      });
      body.appendChild(grid);
    }

    // Pokemon note
    if (s.pokemonNote) {
      const note = document.createElement('div');
      note.style.cssText = 'padding:12px 16px;border-top:1px solid var(--border);color:var(--text-dim);font-size:.85rem';
      note.innerHTML = `<strong>Pok\u00e9mon Sprites:</strong> 151 static PNGs + 151 animated GIFs in <code>emoji-pack/pokemon/</code> and <code>emoji-pack/pokemon-animated/</code>. <a href="${GITHUB_BASE}slack-sorcery/emoji-pack/pokemon/" target="_blank">Browse on GitHub \u2192</a>`;
      body.appendChild(note);
    }

    container.appendChild(div);
  });

  document.getElementById('stats').innerHTML = `<strong>${totalFiles}</strong> files across <strong>${totalSections}</strong> sections`;
}

// Search
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.section').forEach(sec => {
    let any = false;
    if (sec.dataset.id.includes(q)) { any = true; }
    const sName = sec.querySelector('h2');
    if (sName && sName.textContent.toLowerCase().includes(q)) any = true;
    sec.querySelectorAll('.file-list li').forEach(li => {
      const match = !q || li.dataset.name.includes(q);
      li.style.display = match ? '' : 'none';
      if (match) any = true;
    });
    sec.querySelectorAll('.thumb-grid a').forEach(a => {
      const match = !q || a.title.toLowerCase().includes(q);
      a.style.display = match ? '' : 'none';
      if (match) any = true;
    });
    sec.style.display = any ? '' : 'none';
    if (q && any) sec.classList.add('open');
  });
});

render();
