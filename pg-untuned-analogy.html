<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PG Default — The Messy Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f23;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Press Start 2P',monospace;font-size:10px;flex-direction:column;gap:16px}
.stage{position:relative;width:960px;height:540px;background:#1a1a2e;border:4px solid #333;overflow:hidden}
.stage::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px);pointer-events:none;z-index:50}
.title-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;z-index:20;text-shadow:2px 2px 0 #000}
.title-bar h1{font-size:11px;color:#ff6b35}.title-bar p{font-size:7px;color:#aaa;margin-top:6px}
.sprite{position:absolute;transition:all .7s ease;opacity:0;z-index:5}.sprite.on{opacity:1}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .5s}.bg-img.on{opacity:1}
.pbubble{position:absolute;background:rgba(15,15,35,.92);border:3px solid #ff6b35;padding:8px 14px;font-size:7px;color:#fff;opacity:0;transition:opacity .4s;max-width:250px;text-align:center;z-index:20;line-height:1.8;font-family:'Press Start 2P',monospace;backdrop-filter:blur(4px)}
.pbubble.show{opacity:1}.pbubble::after{content:'▼';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);color:#ff6b35;font-size:10px}
.status{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:7px;color:#aaa;z-index:20;white-space:nowrap;opacity:0;transition:opacity .4s;text-shadow:2px 2px 0 #000;background:rgba(15,15,35,.7);padding:4px 12px;border-radius:4px}
.status.show{opacity:1}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes search{0%,100%{transform:translateX(0)}30%{transform:translateX(-15px)}70%{transform:translateX(15px)}}
@keyframes cook{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
.bounce{animation:bounceIn .5s ease forwards}.shake{animation:shake .3s ease infinite}
.search{animation:search 1s ease infinite}.cook{animation:cook .6s ease infinite}
.controls{display:flex;gap:10px}
button{font-family:'Press Start 2P',monospace;background:#ff6b35;color:#fff;border:3px solid #cc5020;padding:8px 16px;font-size:9px;cursor:pointer}
button:hover{background:#ff8855}button.sec{background:#333;color:#999;border-color:#555}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="title-bar"><h1>FOOD TRUCK — PG DEFAULT</h1><p>BIG PANTRY. NOBODY ORGANIZED IT.</p></div>
  <div class="status" id="status"></div>
</div>
<div class="controls"><button onclick="play()">&#9654; PLAY</button><button class="sec" onclick="reset()">&#8634; RESET</button></div>

<script>
const B='https://djangelic.github.io/openclaw/pixel-sprites/';
const IMG={truck:B+'food-truck.png',chef:B+'chef.png',chefStress:B+'chef-stressed.png',chefCook:B+'chef-cooking.png',cust:B+'customer.png',cust2:B+'customer-2.png',cust3:B+'customer-3.png',messy:B+'kitchen-shelf-messy.png',clean:B+'kitchen-shelf-organized.png',pan:B+'frying-pan.png',bgKit:B+'bg-kitchen-interior.png'};
Object.values(IMG).forEach(s=>{new Image().src=s});

const stage=document.getElementById('stage'),statusEl=document.getElementById('status');
let animating=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function addBg(src){const i=document.createElement('img');i.className='bg-img';i.src=src;stage.insertBefore(i,stage.firstChild);return i}
function addImg(src,x,y,w){const i=document.createElement('img');i.className='sprite';i.src=src;i.style.cssText=`left:${x}px;top:${y}px;width:${w}px`;stage.appendChild(i);return i}
function bubble(html,x,y){const d=document.createElement('div');d.className='pbubble';d.innerHTML=html;d.style.left=x+'px';d.style.top=y+'px';stage.appendChild(d);return d}
function show(e,cls=''){e.style.opacity='1';e.classList.add('on');if(cls)e.classList.add(cls)}
function hide(e){e.style.opacity='0'}
function setStatus(t){statusEl.textContent=t;statusEl.classList.add('show')}

function reset(){
  animating=false;
  stage.querySelectorAll('.sprite,.bg-img,.pbubble').forEach(e=>e.remove());
  statusEl.classList.remove('show');statusEl.textContent='';
}

async function play(){
  reset();await sleep(200);animating=true;
  const bg=addBg(IMG.bgKit);show(bg);await sleep(300);
  
  const truck=addImg(IMG.truck,20,260,200);show(truck,'bounce');await sleep(500);
  const chef=addImg(IMG.chef,240,300,100);show(chef,'bounce');await sleep(400);
  show(addImg(IMG.pan,350,350,70),'bounce');
  
  const messy=addImg(IMG.messy,530,200,320);show(messy,'bounce');await sleep(600);
  
  const sp1=bubble("WAY MORE SPACE THAN<br>SQLITE'S TINY SHELF!<br>BUT WHERE'S THE<br>GARLIC...?",480,80);
  await sleep(300);sp1.classList.add('show');
  setStatus('POSTGRESQL: REAL DATABASE. DEFAULT CONFIG WASTES POTENTIAL.');
  await sleep(4000);sp1.classList.remove('show');
  
  if(!animating)return;
  const cust=addImg(IMG.cust,830,310,90);show(cust,'bounce');await sleep(500);
  setStatus('ORDER IN: PASTA WITH GARLIC SAUCE');await sleep(2000);
  
  if(!animating)return;
  chef.classList.add('search');
  const sp2=bubble("WHERE DID I<br>PUT THE GARLIC??",220,200);
  await sleep(300);sp2.classList.add('show');
  setStatus('CHEF SEARCHING MESSY SHELVES... (UNTUNED SHARED_BUFFERS)');
  await sleep(3000);sp2.classList.remove('show');
  
  if(!animating)return;
  chef.style.left='530px';setStatus('CHECKING SHELF 1... NOPE');await sleep(1800);
  chef.style.left='650px';setStatus('SHELF 2... NOT HERE...');await sleep(1800);
  chef.style.left='750px';setStatus('SHELF 3... FOUND IT!');await sleep(1200);
  
  chef.style.left='300px';chef.classList.remove('search');
  chef.src=IMG.chefCook;chef.classList.add('cook');
  setStatus('FINALLY COOKING! ALL THAT SEARCHING COST TIME...');await sleep(2500);
  
  if(!animating)return;
  setStatus('ORDER SERVED! BUT IT TOOK A WHILE...');await sleep(2500);
  
  const sp3=bubble("NOW IMAGINE 50<br>CUSTOMERS AT ONCE...",220,200);
  await sleep(300);sp3.classList.add('show');await sleep(3000);sp3.classList.remove('show');
  
  const custImgs=[IMG.cust2,IMG.cust3,IMG.cust,IMG.cust2,IMG.cust3];
  for(let i=0;i<5;i++){show(addImg(custImgs[i],760+((i%3)*35),290+(Math.floor(i/3)*35),60),'bounce');await sleep(200)}
  
  setStatus('ORDERS PILING UP — CHEF SEARCHING MESSY SHELVES');
  chef.src=IMG.chefStress;chef.classList.remove('cook');chef.classList.add('shake');
  await sleep(3000);
  
  if(!animating)return;
  const sp4=bubble("I'VE GOT THE SPACE<br>BUT EVERYTHING IS<br>A MESS! 71 RPS<br>IS MY LIMIT!",380,80);
  await sleep(300);sp4.classList.add('show');
  setStatus('PG DEFAULT: 71 RPS — BETTER THAN SQLITE (48) BUT UNTUNED');
  await sleep(5000);sp4.classList.remove('show');
  
  if(!animating)return;
  const sp5=bubble("WHAT IF SOMEONE<br>ORGANIZED THESE<br>SHELVES...?",420,100);
  sp5.style.borderColor='#3fb950';
  await sleep(300);sp5.classList.add('show');
  setStatus('>> PGTUNE CAN ORGANIZE THIS KITCHEN FOR FREE...');
  await sleep(5000);animating=false;
}
</script>
</body>
</html>
