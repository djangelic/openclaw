<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortana — Skills & Tools Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e1a; color: #c8d6e5; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #canvas { width: 100vw; height: 100vh; display: block; }
  #tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: rgba(10,14,26,0.95); border: 1px solid #80bdbe;
    border-radius: 8px; padding: 12px 16px; max-width: 320px;
    font-size: 13px; line-height: 1.5; transition: opacity 0.15s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10;
  }
  #tooltip h3 { color: #80bdbe; margin-bottom: 4px; font-size: 14px; }
  #tooltip .tag { display: inline-block; background: rgba(128,189,190,0.15); border-radius: 3px; padding: 1px 6px; font-size: 11px; margin-right: 4px; color: #80bdbe; }
  #legend {
    position: absolute; bottom: 20px; left: 20px; background: rgba(10,14,26,0.85);
    border: 1px solid rgba(128,189,190,0.3); border-radius: 8px; padding: 16px;
    font-size: 12px; z-index: 5;
  }
  #legend h4 { color: #80bdbe; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; margin: 4px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  #title {
    position: absolute; top: 20px; left: 20px;
    font-size: 22px; font-weight: 600; color: #80bdbe;
    text-shadow: 0 0 20px rgba(128,189,190,0.3); z-index: 5;
  }
  #title span { font-size: 13px; color: #6b7b8d; font-weight: 400; display: block; margin-top: 4px; }
  #controls {
    position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 5;
  }
  #search {
    background: rgba(10,14,26,0.85); border: 1px solid rgba(128,189,190,0.3);
    border-radius: 6px; padding: 8px 14px; color: #c8d6e5; font-size: 13px;
    outline: none; width: 220px;
  }
  #search:focus { border-color: #80bdbe; }
  #layout-btns { display: flex; gap: 6px; }
  .layout-btn {
    background: rgba(10,14,26,0.85); border: 1px solid rgba(128,189,190,0.3);
    border-radius: 6px; padding: 7px 12px; color: #6b7b8d; font-size: 12px;
    cursor: pointer; transition: all 0.2s; flex: 1; text-align: center;
  }
  .layout-btn:hover { border-color: #80bdbe; color: #c8d6e5; }
  .layout-btn.active { border-color: #80bdbe; color: #80bdbe; background: rgba(128,189,190,0.1); }
  #detail {
    position: absolute; top: 120px; right: 20px; width: 280px;
    background: rgba(10,14,26,0.9); border: 1px solid rgba(128,189,190,0.3);
    border-radius: 8px; padding: 16px; font-size: 12px; display: none;
    max-height: 60vh; overflow-y: auto; z-index: 5;
  }
  #detail h3 { color: #80bdbe; font-size: 15px; margin-bottom: 6px; }
  #detail .conn { color: #6b7b8d; margin: 2px 0; }
  #detail .conn b { color: #c8d6e5; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="tooltip"></div>
<div id="title">💠 Cortana's Brain Map<span>Skills, tools, and how they connect. Drag nodes to explore.</span></div>
<div id="controls">
  <input id="search" placeholder="🔍 Filter nodes..." />
  <div id="layout-btns">
    <div class="layout-btn active" data-layout="force">🌀 Free</div>
    <div class="layout-btn" data-layout="radial">🎯 Radial</div>
    <div class="layout-btn" data-layout="grid">📊 Grid</div>
    <div class="layout-btn" data-layout="tree">🌳 Tree</div>
  </div>
</div>
<div id="detail"></div>
<div id="legend">
  <h4>Node Types</h4>
  <div class="legend-item"><div class="legend-dot" style="background:#80bdbe"></div>Core (me)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f26622"></div>Skills (specialized abilities)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#6c5ce7"></div>Built-in Tools</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fdcb6e"></div>External APIs / Services</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e17055"></div>Platforms / Surfaces</div>
</div>

<script>
// ── DATA ──
const TYPES = { core: '#80bdbe', skill: '#f26622', tool: '#6c5ce7', api: '#fdcb6e', platform: '#e17055' };
const SIZES = { core: 28, skill: 18, tool: 14, api: 12, platform: 14 };
const TYPE_LABELS = { core: 'Core', skill: 'Skill', tool: 'Tool', api: 'API', platform: 'Platform' };

const nodes = [
  { id: 'cortana', label: 'Cortana 💠', type: 'core', desc: 'AI assistant powered by Claude. Orchestrates everything below.' },
  { id: 'exec', label: 'Shell / Exec', type: 'tool', desc: 'Run any shell command on the host machine (PowerShell, bash).' },
  { id: 'browser', label: 'Browser', type: 'tool', desc: 'Full browser automation — navigate, click, screenshot, scrape.' },
  { id: 'files', label: 'File System', type: 'tool', desc: 'Read, write, and edit files anywhere on the machine.' },
  { id: 'web_search', label: 'Web Search', type: 'tool', desc: 'Brave Search API for web lookups.' },
  { id: 'web_fetch', label: 'Web Fetch', type: 'tool', desc: 'Fetch and extract readable content from URLs.' },
  { id: 'memory', label: 'Memory System', type: 'tool', desc: 'MEMORY.md + daily logs. Semantic search across all memory files.' },
  { id: 'cron', label: 'Cron / Reminders', type: 'tool', desc: 'Schedule tasks, reminders, and recurring jobs.' },
  { id: 'subagents', label: 'Sub-Agents', type: 'tool', desc: 'Spawn isolated background agents for complex/parallel tasks.' },
  { id: 'tts', label: 'Text-to-Speech', type: 'tool', desc: 'Convert text to audio and deliver it.' },
  { id: 'image_tool', label: 'Image Analysis', type: 'tool', desc: 'Analyze images with vision models.' },
  { id: 'message', label: 'Messaging', type: 'tool', desc: 'Send messages, react, pin/unpin across chat platforms.' },
  { id: 'canvas', label: 'Canvas', type: 'tool', desc: 'Present interactive HTML UIs to the user.' },
  { id: 'nodes_tool', label: 'Node Control', type: 'tool', desc: 'Control paired devices — camera, screen, location, commands.' },
  { id: 'sk_calendar', label: '📅 Calendar', type: 'skill', desc: 'Google Calendar via n8n MCP — availability, events, scheduling. Covers Personal, Work, Family, Custody calendars.' },
  { id: 'sk_notion', label: '📓 Notion', type: 'skill', desc: 'Create/manage Notion pages, databases, and blocks. Connected to clients DB, stories, motorcycle DB, pantry, friends.' },
  { id: 'sk_weather', label: '🌤 Weather', type: 'skill', desc: 'Current weather and forecasts via wttr.in / Open-Meteo.' },
  { id: 'sk_slack', label: '💬 Slack', type: 'skill', desc: 'Slack channel actions — reactions, pins, message management.' },
  { id: 'sk_1password', label: '🔐 1Password', type: 'skill', desc: '1Password CLI for secrets management.' },
  { id: 'sk_ofw', label: '👨‍👧‍👦 OFW', type: 'skill', desc: 'OurFamilyWizard — custody calendar, expenses, schedule trade requests with Tara.' },
  { id: 'sk_stories', label: '🎬 n8n Stories', type: 'skill', desc: 'Fetch DevRel story projects from work Notion via MCP. Content pipeline tracking.' },
  { id: 'sk_publii', label: '✍️ Publii Blog', type: 'skill', desc: 'Create posts for djangelic.com — HTML generation, image hosting via GitHub Pages.' },
  { id: 'sk_gamma2wp', label: '🔄 Gamma→WP', type: 'skill', desc: 'Convert Gamma presentations into WordPress posts with Avada Fusion Builder shortcodes.' },
  { id: 'sk_justworks', label: '💰 Justworks', type: 'skill', desc: 'HR platform — expense reports, receipt uploads, reimbursement requests. Okta auth + TOTP MFA.' },
  { id: 'sk_benchmark', label: '📊 n8n Benchmark', type: 'skill', desc: 'Run k6 performance benchmarks across AWS configs for n8n.' },
  { id: 'sk_healthcheck', label: '🛡 Healthcheck', type: 'skill', desc: 'Host security hardening — firewall, SSH, updates, risk audits.' },
  { id: 'sk_skillcreator', label: '🧰 Skill Creator', type: 'skill', desc: 'Design and package new skills with scripts and references.' },
  { id: 'api_n8n', label: 'n8n Server', type: 'api', desc: 'n8n.aztechsol.com — workflow automation hub. Hosts MCP servers, webhooks, calendar integration.' },
  { id: 'api_notion', label: 'Notion API', type: 'api', desc: 'Notion databases: clients, stories, motorcycle, pantry, friends.' },
  { id: 'api_wp', label: 'WordPress API', type: 'api', desc: 'aztechsol.com REST API — posts, pages, media. Avada/Fusion Builder.' },
  { id: 'api_wave', label: 'Wave Invoicing', type: 'api', desc: 'GraphQL API for invoicing and payment tracking.' },
  { id: 'api_ofw', label: 'OFW API', type: 'api', desc: 'OurFamilyWizard REST API — custody calendar and expense management.' },
  { id: 'api_justworks', label: 'Justworks API', type: 'api', desc: 'Okta auth + GraphQL expenses API for reimbursements.' },
  { id: 'api_gcal', label: 'Google Calendar', type: 'api', desc: '5 calendars: Personal, Work, TNA Events, Custody, Friends.' },
  { id: 'api_github', label: 'GitHub Pages', type: 'api', desc: 'djangelic.github.io/openclaw — file sharing, blog images, visualizations.' },
  { id: 'api_brave', label: 'Brave Search', type: 'api', desc: 'Web search API for research and lookups.' },
  { id: 'plt_slack', label: 'Slack', type: 'platform', desc: 'Primary communication channel with Angel. DMs + workspace channels.' },
  { id: 'plt_discord', label: 'Discord', type: 'platform', desc: 'Community and group chat platform.' },
  { id: 'plt_telegram', label: 'Telegram', type: 'platform', desc: 'Alternative messaging surface.' },
];

const edges = [
  ...['exec','browser','files','web_search','web_fetch','memory','cron','subagents','tts','image_tool','message','canvas','nodes_tool']
    .map(t => ({ from: 'cortana', to: t })),
  ...['sk_calendar','sk_notion','sk_weather','sk_slack','sk_1password','sk_ofw','sk_stories','sk_publii','sk_gamma2wp','sk_justworks','sk_benchmark','sk_healthcheck','sk_skillcreator']
    .map(s => ({ from: 'cortana', to: s })),
  { from: 'sk_calendar', to: 'api_n8n' }, { from: 'sk_calendar', to: 'api_gcal' },
  { from: 'sk_notion', to: 'api_notion' },
  { from: 'sk_stories', to: 'api_n8n' }, { from: 'sk_stories', to: 'api_notion' },
  { from: 'sk_ofw', to: 'api_ofw' },
  { from: 'sk_justworks', to: 'api_justworks' },
  { from: 'sk_publii', to: 'api_github' },
  { from: 'sk_gamma2wp', to: 'api_wp' },
  { from: 'sk_benchmark', to: 'api_n8n' },
  { from: 'web_search', to: 'api_brave' },
  { from: 'message', to: 'plt_slack' }, { from: 'message', to: 'plt_discord' }, { from: 'message', to: 'plt_telegram' },
  { from: 'sk_slack', to: 'plt_slack' },
  { from: 'api_n8n', to: 'api_gcal' },
  { from: 'api_n8n', to: 'api_wp' },
  { from: 'sk_publii', to: 'files' },
  { from: 'sk_gamma2wp', to: 'browser' },
  { from: 'sk_justworks', to: 'browser' },
  { from: 'sk_healthcheck', to: 'exec' },
  { from: 'cron', to: 'subagents' },
  { from: 'memory', to: 'files' },
];

// ── CANVAS SETUP ──
const W = window.innerWidth, H = window.innerHeight;
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
cvs.width = W * devicePixelRatio; cvs.height = H * devicePixelRatio;
ctx.scale(devicePixelRatio, devicePixelRatio);
cvs.style.width = W + 'px'; cvs.style.height = H + 'px';

nodes.forEach(n => {
  n.x = W/2 + (Math.random()-0.5)*400;
  n.y = H/2 + (Math.random()-0.5)*400;
  n.tx = n.x; n.ty = n.y; // target positions for layout transitions
  n.vx = 0; n.vy = 0;
  n.r = SIZES[n.type];
});

const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
let hovered = null, dragged = null, filterText = '';
let camX = 0, camY = 0, camZoom = 1;
let currentLayout = 'force';
let simActive = true;

// ── LAYOUT FUNCTIONS ──
function layoutRadial() {
  simActive = false;
  const cx = W/2, cy = H/2;
  const core = nodeMap['cortana'];
  core.tx = cx; core.ty = cy;

  const groups = { tool: [], skill: [], api: [], platform: [] };
  nodes.forEach(n => { if (n.type !== 'core') groups[n.type].push(n); });

  const rings = [
    { type: 'tool', radius: 160, color: '#6c5ce7' },
    { type: 'skill', radius: 300, color: '#f26622' },
    { type: 'api', radius: 420, color: '#fdcb6e' },
    { type: 'platform', radius: 420, color: '#e17055' },
  ];

  // Platforms share ring with APIs but offset
  const apis = groups.api;
  const plats = groups.platform;
  const outerAll = [...apis, ...plats];

  rings.forEach(ring => {
    if (ring.type === 'platform' || ring.type === 'api') return; // handle together
    const items = groups[ring.type];
    items.forEach((n, i) => {
      const a = (i / items.length) * Math.PI * 2 - Math.PI/2;
      n.tx = cx + Math.cos(a) * ring.radius;
      n.ty = cy + Math.sin(a) * ring.radius;
    });
  });

  outerAll.forEach((n, i) => {
    const a = (i / outerAll.length) * Math.PI * 2 - Math.PI/2;
    n.tx = cx + Math.cos(a) * 420;
    n.ty = cy + Math.sin(a) * 420;
  });
}

function layoutGrid() {
  simActive = false;
  const groups = { core: [], tool: [], skill: [], api: [], platform: [] };
  nodes.forEach(n => groups[n.type].push(n));

  const order = ['core', 'tool', 'skill', 'api', 'platform'];
  const labels = { core: '💠 CORE', tool: '🟣 BUILT-IN TOOLS', skill: '🟠 SKILLS', api: '🟡 EXTERNAL APIs', platform: '🔴 PLATFORMS' };
  
  let y = 80;
  const colWidth = 150;

  order.forEach(type => {
    const items = groups[type];
    if (!items.length) return;
    const totalW = items.length * colWidth;
    const startX = (W - totalW) / 2 + colWidth/2;
    items.forEach((n, i) => {
      n.tx = startX + i * colWidth;
      n.ty = y;
    });
    y += type === 'core' ? 100 : 120;
  });

  // Center vertically
  const offset = (H - y) / 2;
  if (offset > 0) nodes.forEach(n => n.ty += offset);
}

function layoutTree() {
  simActive = false;
  const cx = W/2;
  const core = nodeMap['cortana'];
  core.tx = cx; core.ty = 60;

  // Level 1: Tools + Skills side by side
  const tools = nodes.filter(n => n.type === 'tool');
  const skills = nodes.filter(n => n.type === 'skill');

  const toolWidth = Math.min(110, (W * 0.45) / tools.length);
  const toolStartX = W * 0.02;
  tools.forEach((n, i) => {
    n.tx = toolStartX + i * toolWidth + toolWidth/2;
    n.ty = 200;
  });

  const skillWidth = Math.min(110, (W * 0.45) / skills.length);
  const skillStartX = W * 0.53;
  skills.forEach((n, i) => {
    n.tx = skillStartX + i * skillWidth + skillWidth/2;
    n.ty = 200;
  });

  // Level 2: APIs and platforms
  const apis = nodes.filter(n => n.type === 'api');
  const plats = nodes.filter(n => n.type === 'platform');
  const bottom = [...apis, ...plats];
  const bWidth = Math.min(130, (W * 0.8) / bottom.length);
  const bStart = (W - bottom.length * bWidth) / 2 + bWidth/2;
  bottom.forEach((n, i) => {
    n.tx = bStart + i * bWidth;
    n.ty = 380;
  });

  // Center vertically
  const totalH = 380 + 40;
  const offset = (H - totalH) / 2;
  nodes.forEach(n => n.ty += Math.max(0, offset));
}

function layoutForce() {
  simActive = true;
  // Just let the simulation run freely
  nodes.forEach(n => { n.tx = n.x; n.ty = n.y; });
}

function setLayout(name) {
  currentLayout = name;
  document.querySelectorAll('.layout-btn').forEach(b => b.classList.toggle('active', b.dataset.layout === name));
  
  if (name === 'radial') layoutRadial();
  else if (name === 'grid') layoutGrid();
  else if (name === 'tree') layoutTree();
  else layoutForce();

  // Reset camera for non-force layouts
  if (name !== 'force') { camX = 0; camY = 0; camZoom = 1; }
}

// ── SIMULATION ──
function tick() {
  if (simActive) {
    // Force simulation
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        let dx = nodes[j].x - nodes[i].x, dy = nodes[j].y - nodes[i].y;
        let d2 = dx*dx + dy*dy || 1;
        let f = 800 / d2 * 0.3;
        nodes[i].vx -= dx * f; nodes[i].vy -= dy * f;
        nodes[j].vx += dx * f; nodes[j].vy += dy * f;
      }
    }
    edges.forEach(e => {
      const a = nodeMap[e.from], b = nodeMap[e.to];
      if (!a || !b) return;
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.sqrt(dx*dx + dy*dy) || 1;
      let ideal = (a.type === 'core' || b.type === 'core') ? 180 : 120;
      let f = (d - ideal) * 0.0015;
      a.vx += dx/d * f; a.vy += dy/d * f;
      b.vx -= dx/d * f; b.vy -= dy/d * f;
    });
    nodes.forEach(n => {
      n.vx += (W/2 - n.x) * 0.0005; n.vy += (H/2 - n.y) * 0.0005;
      n.vx *= 0.85; n.vy *= 0.85;
      if (n !== dragged) { n.x += n.vx; n.y += n.vy; }
    });
  } else {
    // Animate toward target positions
    nodes.forEach(n => {
      if (n === dragged) return;
      n.x += (n.tx - n.x) * 0.12;
      n.y += (n.ty - n.y) * 0.12;
      n.vx = 0; n.vy = 0;
    });
  }
}

function drawCurvedEdge(ax, ay, bx, by, color, width) {
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  // Slight curve for visual clarity
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const dx = bx - ax, dy = by - ay;
  const cx2 = mx - dy * 0.05, cy2 = my + dx * 0.05;
  ctx.quadraticCurveTo(cx2, cy2, bx, by);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(camX, camY);
  ctx.scale(camZoom, camZoom);

  const connectedToHover = new Set();
  if (hovered) {
    edges.forEach(e => {
      if (e.from === hovered.id) connectedToHover.add(e.to);
      if (e.to === hovered.id) connectedToHover.add(e.from);
    });
    connectedToHover.add(hovered.id);
  }

  // Draw group labels for grid/tree layouts
  if (currentLayout === 'grid' || currentLayout === 'tree') {
    const groups = {};
    nodes.forEach(n => {
      if (!groups[n.type]) groups[n.type] = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      const g = groups[n.type];
      g.minX = Math.min(g.minX, n.x - n.r - 30);
      g.maxX = Math.max(g.maxX, n.x + n.r + 30);
      g.minY = Math.min(g.minY, n.y - n.r - 25);
      g.maxY = Math.max(g.maxY, n.y + n.r + 25);
    });
    const groupLabels = { core: '💠 CORE', tool: '🟣 TOOLS', skill: '🟠 SKILLS', api: '🟡 APIs', platform: '🔴 PLATFORMS' };
    Object.entries(groups).forEach(([type, g]) => {
      if (type === 'core') return;
      ctx.beginPath();
      const pad = 15;
      const rx = g.minX - pad, ry = g.minY - pad;
      const rw = g.maxX - g.minX + pad*2, rh = g.maxY - g.minY + pad*2;
      ctx.roundRect(rx, ry, rw, rh, 8);
      ctx.fillStyle = TYPES[type] + '08';
      ctx.strokeStyle = TYPES[type] + '20';
      ctx.lineWidth = 1;
      ctx.fill(); ctx.stroke();
      // Label
      ctx.fillStyle = TYPES[type] + '60';
      ctx.font = "bold 11px 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = 'left';
      ctx.fillText(groupLabels[type] || type, rx + 8, ry + 14);
    });
  }

  // Draw ring guides for radial layout
  if (currentLayout === 'radial') {
    [160, 300, 420].forEach(r => {
      ctx.beginPath();
      ctx.arc(W/2, H/2, r, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(128,189,190,0.08)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 8]);
      ctx.stroke();
      ctx.setLineDash([]);
    });
    // Ring labels
    ctx.fillStyle = 'rgba(128,189,190,0.2)';
    ctx.font = "10px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = 'left';
    ctx.fillText('Tools', W/2 + 5, H/2 - 165);
    ctx.fillText('Skills', W/2 + 5, H/2 - 305);
    ctx.fillText('APIs & Platforms', W/2 + 5, H/2 - 425);
  }

  // Edges
  edges.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return;
    const active = !hovered || (connectedToHover.has(a.id) && connectedToHover.has(b.id));
    const color = active ? 'rgba(128,189,190,0.2)' : 'rgba(128,189,190,0.04)';
    const width = active ? (hovered ? 2 : 1.2) : 0.5;
    drawCurvedEdge(a.x, a.y, b.x, b.y, color, width);
  });

  // Nodes
  nodes.forEach(n => {
    const dimmed = filterText && !n.label.toLowerCase().includes(filterText);
    const active = !hovered || connectedToHover.has(n.id);
    ctx.globalAlpha = dimmed ? 0.12 : (active ? 1 : 0.12);

    // Glow
    if ((n === hovered || n.type === 'core') && !dimmed) {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 2, 0, Math.PI*2);
      const g = ctx.createRadialGradient(n.x, n.y, n.r*0.3, n.x, n.y, n.r*2);
      g.addColorStop(0, TYPES[n.type] + '50'); g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.fill();
    }

    // Circle
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fillStyle = TYPES[n.type];
    ctx.fill();
    ctx.strokeStyle = n === hovered ? '#fff' : '#0a0e1a';
    ctx.lineWidth = n === hovered ? 2.5 : 2;
    ctx.stroke();

    // Label
    ctx.fillStyle = active ? '#dde4ed' : '#6b7b8d';
    const fontSize = n.type === 'core' ? 13 : (currentLayout === 'force' ? 11 : 10);
    ctx.font = (n.type === 'core' ? 'bold ' : '') + fontSize + "px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(n.label, n.x, n.y + n.r + 15);

    ctx.globalAlpha = 1;
  });

  ctx.restore();
  tick();
  requestAnimationFrame(draw);
}

// ── INTERACTION ──
function screenToWorld(sx, sy) {
  return [(sx - camX) / camZoom, (sy - camY) / camZoom];
}
function hitTest(sx, sy) {
  const [wx, wy] = screenToWorld(sx, sy);
  for (let i = nodes.length-1; i >= 0; i--) {
    const n = nodes[i];
    if ((n.x-wx)**2 + (n.y-wy)**2 < (n.r+6)**2) return n;
  }
  return null;
}

const tooltip = document.getElementById('tooltip');
const detail = document.getElementById('detail');

cvs.addEventListener('mousemove', e => {
  const n = hitTest(e.clientX, e.clientY);
  hovered = n;
  cvs.style.cursor = n ? 'pointer' : (dragged ? 'grabbing' : 'default');
  if (n && !dragged) {
    tooltip.innerHTML = `<h3>${n.label}</h3><span class="tag">${TYPE_LABELS[n.type]}</span><br/>${n.desc}`;
    tooltip.style.opacity = 1;
    let tx = e.clientX + 16, ty = e.clientY - 10;
    if (tx + 320 > W) tx = e.clientX - 336;
    if (ty + 100 > H) ty = H - 110;
    tooltip.style.left = tx + 'px'; tooltip.style.top = ty + 'px';
  } else { tooltip.style.opacity = 0; }

  if (dragged) {
    const [wx, wy] = screenToWorld(e.clientX, e.clientY);
    dragged.x = wx; dragged.y = wy;
    dragged.tx = wx; dragged.ty = wy;
    dragged.vx = 0; dragged.vy = 0;
  }
});

cvs.addEventListener('mousedown', e => {
  const n = hitTest(e.clientX, e.clientY);
  if (n) { dragged = n; showDetail(n); }
});
cvs.addEventListener('mouseup', () => { dragged = null; });
cvs.addEventListener('mouseleave', () => { dragged = null; hovered = null; tooltip.style.opacity = 0; });

cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const oldZoom = camZoom;
  camZoom *= (e.deltaY < 0 ? 1.1 : 0.9);
  camZoom = Math.max(0.3, Math.min(3, camZoom));
  camX = e.clientX - (e.clientX - camX) * (camZoom / oldZoom);
  camY = e.clientY - (e.clientY - camY) * (camZoom / oldZoom);
}, { passive: false });

// Pan with right-click drag
let panning = false, panStart = {};
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('mousedown', e => {
  if (e.button === 2 || e.button === 1) {
    panning = true; panStart = { x: e.clientX - camX, y: e.clientY - camY };
    e.preventDefault();
  }
});
cvs.addEventListener('mousemove', e => {
  if (panning) { camX = e.clientX - panStart.x; camY = e.clientY - panStart.y; }
});
cvs.addEventListener('mouseup', e => { if (e.button === 2 || e.button === 1) panning = false; });

document.getElementById('search').addEventListener('input', e => {
  filterText = e.target.value.toLowerCase();
});

document.querySelectorAll('.layout-btn').forEach(btn => {
  btn.addEventListener('click', () => setLayout(btn.dataset.layout));
});

function showDetail(n) {
  const conns = [];
  edges.forEach(e => {
    if (e.from === n.id && nodeMap[e.to]) conns.push({ dir: '→', node: nodeMap[e.to] });
    if (e.to === n.id && nodeMap[e.from]) conns.push({ dir: '←', node: nodeMap[e.from] });
  });
  let html = `<h3>${n.label}</h3><p style="margin-bottom:8px;color:#9ab">${n.desc}</p>`;
  html += `<span style="display:inline-block;background:${TYPES[n.type]}20;color:${TYPES[n.type]};border-radius:3px;padding:2px 8px;font-size:11px;margin-bottom:8px">${TYPE_LABELS[n.type]}</span>`;
  if (conns.length) {
    html += '<hr style="border-color:rgba(128,189,190,0.15);margin:8px 0">';
    html += `<b style="color:#80bdbe;font-size:11px">${conns.length} Connection${conns.length>1?'s':''}:</b>`;
    conns.forEach(c => {
      html += `<div class="conn">${c.dir} <b>${c.node.label}</b> <span style="color:${TYPES[c.node.type]}">(${TYPE_LABELS[c.node.type]})</span></div>`;
    });
  }
  detail.innerHTML = html;
  detail.style.display = 'block';
}

// Start
draw();
</script>
</body>
</html>
