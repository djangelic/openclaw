<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Crystal gradient -->
    <linearGradient id="crystalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Claw gradient -->
    <linearGradient id="clawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Inner glow -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology operator="dilate" radius="2"/>
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Central Crystal Core -->
  <g filter="url(#innerGlow)">
    <!-- Main diamond shape -->
    <path d="M60 15 L85 45 L60 75 L35 45 Z" fill="url(#crystalGradient)" stroke="#1E40AF" stroke-width="2"/>
    
    <!-- Crystal facets for depth -->
    <path d="M60 15 L72.5 30 L60 45 L47.5 30 Z" fill="#93C5FD" opacity="0.8"/>
    <path d="M47.5 30 L35 45 L47.5 60 L60 45 Z" fill="#60A5FA" opacity="0.6"/>
    <path d="M72.5 30 L85 45 L72.5 60 L60 45 Z" fill="#3B82F6" opacity="0.7"/>
    <path d="M60 45 L72.5 60 L60 75 L47.5 60 Z" fill="#1D4ED8" opacity="0.8"/>
    
    <!-- Inner highlight -->
    <path d="M60 20 L70 35 L60 40 L55 30 Z" fill="#DBEAFE" opacity="0.9"/>
  </g>
  
  <!-- Claw Elements -->
  <g>
    <!-- Top-left claw -->
    <path d="M25 25 Q30 20 35 25 Q32 30 25 35 Q20 30 25 25 Z" fill="url(#clawGradient)" stroke="#92400E" stroke-width="1.5"/>
    <path d="M25 25 Q28 22 32 25 Q30 28 25 30" fill="#FCD34D" opacity="0.7"/>
    
    <!-- Top-right claw -->
    <path d="M95 25 Q90 20 85 25 Q88 30 95 35 Q100 30 95 25 Z" fill="url(#clawGradient)" stroke="#92400E" stroke-width="1.5"/>
    <path d="M95 25 Q92 22 88 25 Q90 28 95 30" fill="#FCD34D" opacity="0.7"/>
    
    <!-- Bottom-left claw -->
    <path d="M25 95 Q30 100 35 95 Q32 90 25 85 Q20 90 25 95 Z" fill="url(#clawGradient)" stroke="#92400E" stroke-width="1.5"/>
    <path d="M25 95 Q28 98 32 95 Q30 92 25 90" fill="#FCD34D" opacity="0.7"/>
    
    <!-- Bottom-right claw -->
    <path d="M95 95 Q90 100 85 95 Q88 90 95 85 Q100 90 95 95 Z" fill="url(#clawGradient)" stroke="#92400E" stroke-width="1.5"/>
    <path d="M95 95 Q92 98 88 95 Q90 92 95 90" fill="#FCD34D" opacity="0.7"/>
  </g>
  
  <!-- Connecting energy lines -->
  <g opacity="0.6">
    <path d="M35 35 Q50 50 35 65" stroke="#60A5FA" stroke-width="2" fill="none"/>
    <path d="M85 35 Q70 50 85 65" stroke="#60A5FA" stroke-width="2" fill="none"/>
    <path d="M35 35 Q50 20 65 35" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
    <path d="M85 85 Q70 100 55 85" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Central glow effect -->
  <circle cx="60" cy="45" r="25" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.3"/>
  <circle cx="60" cy="45" r="20" fill="none" stroke="#DBEAFE" stroke-width="0.5" opacity="0.5"/>
</svg>