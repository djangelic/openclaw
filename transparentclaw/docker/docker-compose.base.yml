# TransparentClaw Base Docker Compose Configuration
# This is the base template that gets customized during deployment

version: '3.8'

services:
  # PostgreSQL Database - Shared between n8n and OpenClaw Gateway
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transparentclaw
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_default_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - transparentclaw-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d transparentclaw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # n8n - Workflow Engine with Chat Hub
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Database Configuration
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: transparentclaw
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-secure_default_password_change_me}
      
      # n8n Core Configuration
      N8N_BASIC_AUTH_ACTIVE: false
      N8N_HOST: ${N8N_HOST:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_HOST:-http://localhost:5678}/
      N8N_EDITOR_BASE_URL: ${N8N_HOST:-http://localhost:5678}/
      
      # Chat Hub Configuration
      N8N_CHAT_ENABLED: true
      N8N_CHAT_PUBLIC_URL: ${N8N_HOST:-http://localhost:5678}
      
      # Feature Toggles
      N8N_TEMPLATES_ENABLED: true
      N8N_ONBOARDING_CALL_PROMPT_ENABLED: false
      N8N_PERSONALIZATION_ENABLED: false
      N8N_COMMUNITY_PACKAGES_ENABLED: true
      N8N_VERSION_NOTIFICATIONS_ENABLED: false
      
      # Security & Performance
      N8N_SECURE_COOKIE: false
      N8N_LOG_LEVEL: ${LOG_LEVEL:-info}
      N8N_DIAGNOSTICS_ENABLED: false
      N8N_HIRING_BANNER_ENABLED: false
      
      # Execution Configuration
      EXECUTIONS_TIMEOUT: 3600
      EXECUTIONS_TIMEOUT_MAX: 7200
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_MAX_AGE: 336 # 14 days
      
      # Workflow Configuration
      WORKFLOWS_DEFAULT_NAME: "TransparentClaw Workflow"
      
    volumes:
      - n8n-data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./templates:/home/node/.n8n/workflows:ro
      - ./docker/n8n/custom:/home/node/.n8n/custom:ro
    networks:
      - transparentclaw-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Bridge Service - Syncs OpenClaw ↔ n8n
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD:-secure_default_password_change_me}@postgres:5432/transparentclaw
      
      # Service Endpoints
      N8N_BASE_URL: http://n8n:5678
      GATEWAY_BASE_URL: http://gateway:3100
      
      # Bridge Configuration
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL:-5000}
      ENABLE_MEMORY_SYNC: true
      ENABLE_SKILL_SYNC: true
      ENABLE_TOOL_PROXY: true
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-production}
      
    volumes:
      - ./agent-data:/app/data
      - bridge-logs:/app/logs
    networks:
      - transparentclaw-network
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  transparentclaw-network:
    driver: bridge
    name: transparentclaw

volumes:
  postgres-data:
    name: transparentclaw_postgres
    driver: local
  n8n-data:
    name: transparentclaw_n8n
    driver: local
  bridge-logs:
    name: transparentclaw_bridge_logs
    driver: local

# Health Check Endpoint for the entire stack
# Accessible at http://localhost:5678/api/health
x-healthcheck-config: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s